name: Build Windows 8.1 / 10 / 11 Installer
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-legacy.txt pytest pytest-timeout

      - name: Run unit & Qt UI tests
        shell: pwsh
        run: |
          foreach ($attempt in 1, 2) {
            cmd /c "python -m pytest -v --tb=short --timeout=300 > pytest_report.txt 2>&1"
            $code = $LASTEXITCODE
            if (Test-Path pytest_report.txt) {
              Get-Content pytest_report.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
              Get-Content pytest_report.txt
            }
            if ($code -eq 0) { break }
            Write-Host "pytest failed (attempt $attempt, exit $code); retrying once for CI timing flakes"
            if ($attempt -eq 2) {
              Select-String -Path pytest_report.txt -Pattern '^FAILED ', '^E   ' | Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$(($_.Line) -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A')" }
              exit $code
            }
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build NeonLGControl81.exe (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name NeonLGControl81 --icon "assets\neon.ico" --version-file "assets\version_info.txt" --add-data "change_region.sh;." --add-data "assets;assets" --add-data "samsung-belet/BeletSamsungClient-unsigned.wgt;samsung-belet" --add-data "lg-belet;lg-belet" --exclude-module PyQt5.QtWebEngineWidgets --exclude-module PyQt5.QtWebEngineCore --exclude-module PyQt5.QtQml --exclude-module PyQt5.QtQuick --exclude-module PyQt5.QtMultimedia --exclude-module PyQt5.QtBluetooth --exclude-module PyQt5.QtDesigner --exclude-module tkinter --uac-admin app_legacy.py

      - name: Verify embedded Win32 icon and LF line endings in built EXE bundle
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = Resolve-Path "dist\NeonLGControl81\NeonLGControl81.exe"
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.Path)
          if ($null -eq $ico) { throw "ExtractAssociatedIcon returned null for $($exe.Path)" }
          $bmp = $ico.ToBitmap()
          Write-Host "Extracted EXE icon bitmap: $($bmp.Width)x$($bmp.Height)"
          if ($bmp.Width -lt 16 -or $bmp.Height -lt 16) { throw "Invalid icon dimensions" }
          $shPath = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "change_region.sh" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $shPath) { throw "change_region.sh missing in dist bundle" }
          $bytes = [System.IO.File]::ReadAllBytes($shPath)
          if ($bytes -contains 13) { throw "change_region.sh in dist contains CR (\r) bytes!" }
          Write-Host "Verified LF-only change_region.sh at $shPath"
          $pemPath = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "cacert.pem" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $pemPath) { throw "certifi cacert.pem missing in dist bundle" }
          Write-Host "Verified certifi CA bundle at $pemPath"
          $caAuth = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "vd_tizen_dev_author_ca.cer" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $caPub = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "vd_tizen_dev_public2.crt" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $caAuth -or -not $caPub) { throw "Bundled Samsung VD CA certs missing in dist bundle" }
          Write-Host "Verified bundled Samsung VD CA certs: $caAuth | $caPub"
          $beletWgt = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "BeletSamsungClient-unsigned.wgt" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $beletWgt) { throw "Bundled Belet Samsung client WGT missing" }
          Write-Host "Verified bundled Belet Samsung client: $beletWgt"
          $beletIpk = Get-ChildItem -Path "dist\NeonLGControl81" -Filter "BeletLgClient-webOS-unsigned.ipk" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $beletIpk) { throw "Bundled Belet LG client IPK missing" }
          Write-Host "Verified bundled Belet LG client: $beletIpk"

      - name: Locate or install NSIS 3.x
        shell: pwsh
        run: |
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $nsis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $nsis) {
            choco install nsis -y --no-progress
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $nsis)) { throw "makensis.exe not available" }
          Write-Host "Using NSIS: $nsis"
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows Installer (NEON_Setup_Win81_10_11.exe)
        shell: pwsh
        run: |
          & "$env:MAKENSIS" /V3 installer\neon_setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\NEON_Setup_Win81_10_11.exe")) {
            throw "Installer EXE missing!"
          }
          Get-Item "dist\NEON_Setup_Win81_10_11.exe" | Select-Object Name, Length

      - name: Smoke test silent Install, Desktop shortcut, and Complete Uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\NEON_Setup_Win81_10_11.exe").Path
          $appDataDir = Join-Path $env:APPDATA "NEON"
          New-Item -ItemType Directory -Path $appDataDir -Force | Out-Null
          '{"tv_ip":"192.168.1.42"}' | Set-Content (Join-Path $appDataDir "settings.json")

          $proc = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with code $($proc.ExitCode)" }

          $instDir = "C:\Program Files\NEON"
          $exe = Join-Path $instDir "NeonLGControl81.exe"
          $uninst = Join-Path $instDir "Uninstall.exe"
          $desktopLnk = "C:\Users\Public\Desktop\NEON.lnk"
          $startLnk = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\NEON\NEON Console.lnk"
          $regPath = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NEON_LG_Control"

          foreach ($p in @($exe, $uninst, $desktopLnk, $startLnk, $regPath)) {
            if (-not (Test-Path $p)) { throw "Missing after install: $p" }
          }

          $wsh = New-Object -ComObject WScript.Shell
          $sc = $wsh.CreateShortcut($desktopLnk)
          Write-Host "Desktop shortcut target: $($sc.TargetPath) | icon: $($sc.IconLocation)"
          if ($sc.TargetPath -ne $exe) { throw "Unexpected shortcut target: $($sc.TargetPath)" }

          Start-Process -FilePath $uninst -ArgumentList "/S"
          $deadline = (Get-Date).AddSeconds(20)
          while ((Test-Path $instDir) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 300
          }

          foreach ($p in @($instDir, $desktopLnk, $startLnk, $appDataDir, $regPath)) {
            if (Test-Path $p) { throw "Leftover not removed by uninstaller: $p" }
          }
          Write-Host "Silent install + Desktop shortcut + Complete uninstall verified 100%!"

      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path "dist\NeonLGControl81" -DestinationPath "dist\NeonLGControl-Windows81-Portable.zip" -Force

      - name: Build Belet LG webOS client IPK
        run: |
          python scripts/build_belet_lg_client.py
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "lg-belet/BeletLgClient-webOS-unsigned.ipk" "dist/BeletLgClient-webOS-unsigned.ipk" -Force
          Get-Item "dist/BeletLgClient-webOS-unsigned.ipk" | Select-Object Name, Length

      - name: Publish Windows builds as draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-installer-${{ github.run_id }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist/NEON_Setup_Win81_10_11.exe" `
            "dist/NeonLGControl-Windows81-Portable.zip" `
            "dist/BeletLgClient-webOS-unsigned.ipk" `
            --draft `
            --title "Windows Installer build $env:GITHUB_RUN_NUMBER" `
            --notes "Windows installer and portable bundle built from commit $env:GITHUB_SHA." `
            --repo $env:GITHUB_REPOSITORY
