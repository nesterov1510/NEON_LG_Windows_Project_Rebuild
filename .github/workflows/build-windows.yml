name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Run unit tests
        shell: pwsh
        run: |
          foreach ($attempt in 1, 2) {
            cmd /c "python -m pytest -v --tb=short tests/test_core.py tests/test_alemtv.py tests/test_lg_remote.py tests/test_belet_catalog_proxy.py tests/test_belet_ui_cleanup.py tests/test_local_tv_packages.py tests/test_belet_samsung_client.py tests/test_msb_callback.py tests/test_msb_tv_app.py > pytest_report.txt 2>&1"
            $code = $LASTEXITCODE
            if (Test-Path pytest_report.txt) {
              Get-Content pytest_report.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            }
            if ($code -eq 0) { break }
            Write-Host "pytest failed (attempt $attempt, exit $code); retrying once for CI timing flakes"
            if ($attempt -eq 2) {
              Select-String -Path pytest_report.txt -Pattern '^FAILED ', '^E   ' | Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$(($_.Line) -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A')" }
              exit $code
            }
          }

      - name: Bundle and check embedded VLESS engine
        run: python scripts/prepare_vless.py --check

      - run: python -m PyInstaller --noconfirm --clean --windowed --name NeonLGControl --icon "assets\neon.ico" --version-file "assets\version_info.txt" --add-data "change_region.sh;." --add-data "ui.html;." --add-data "assets;assets" --add-data "lg-belet;lg-belet" --add-data "samsung-belet/BeletSamsungClient-unsigned.wgt;samsung-belet" --uac-admin app.py
      - name: Verify bundled Samsung Belet client
        shell: pwsh
        run: |
          $wgt = Get-ChildItem -Path "dist\NeonLGControl" -Filter "BeletSamsungClient-unsigned.wgt" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wgt) { throw "Bundled Belet Samsung client WGT missing" }
          Write-Host "Verified bundled Belet Samsung client: $wgt"

      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path "dist\NeonLGControl" -DestinationPath "dist\NeonLGControl-Windows.zip" -Force

      - name: Publish Windows app as a draft release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-app-${{ github.run_id }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist/NeonLGControl-Windows.zip" `
            --draft `
            --title "Windows app build $env:GITHUB_RUN_NUMBER" `
            --notes "Windows app bundle built from commit $env:GITHUB_SHA." `
            --repo $env:GITHUB_REPOSITORY
