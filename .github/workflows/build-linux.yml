name: Build Linux AppImage
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run unit tests
        run: |
          for attempt in 1 2; do
            python -m pytest -v --tb=short tests/test_core.py tests/test_alemtv.py tests/test_vless.py tests/test_happ_client.py tests/test_samsung_catalog.py | tee pytest_report.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then break; fi
            echo "pytest failed (attempt $attempt, exit $code); retrying once for CI timing flakes"
            if [ "$attempt" -eq 2 ]; then exit $code; fi
          done

      - name: Upload pytest report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-linux
          path: pytest_report.txt
          if-no-files-found: ignore

      - name: Build Linux bundle (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name NeonLGControl \
            --icon "assets/neon.png" \
            --add-data "ui.html:." \
            --add-data "change_region.sh:." \
            --add-data "assets:assets" \
            --add-data "samsung-belet/BeletSamsungClient-unsigned.wgt:samsung-belet" \
            --add-data "belet_samsung_native:belet_samsung_native" \
            --add-data "belet_vidaa_client:belet_vidaa_client" \
            --exclude-module PyQt5 \
            --exclude-module PyQt5.QtWebEngineWidgets \
            --exclude-module PyQt5.QtWebEngineCore \
            --exclude-module tkinter \
            app_linux.py

      - name: Assemble AppDir
        run: |
          set -e
          APP_NAME=NeonLGControl
          APP_DIR="dist/${APP_NAME}.AppDir"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr" "$APP_DIR/usr/share/applications" "$APP_DIR/usr/share/icons/hicolor/256x256/apps" "$APP_DIR/usr/bin"
          cp -r "dist/$APP_NAME" "$APP_DIR/usr/bin/$APP_NAME"
          cp "assets/neon.png" "$APP_DIR/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
          # appimagetool derives the icon from the desktop file's Icon key and
          # expects <Icon>.png at the AppDir root.
          cp "assets/neon.png" "$APP_DIR/${APP_NAME}.png"
          cat > "$APP_DIR/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=NeonLGControl
          GenericName=NEON / LG webOS Region Console
          Comment=LG webOS region console, Samsung Tizen installer, Alem TV generator
          Exec="$APP_DIR/usr/bin/$APP_NAME"
          Icon=${APP_NAME}
          Terminal=false
          Categories=Utility;
          EOF
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$HERE/usr/bin/NeonLGControl" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"

      - name: Download appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/13/obsolete-appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage

      - name: Package AppImage
        run: |
          cd dist
          /tmp/appimagetool.AppImage --appimage-extract-and-run NeonLGControl.AppDir 2>&1 | tee ../package_log.txt
          # appimagetool names the AppImage after the desktop file's Name
          # (e.g. NEON_/_LG_webOS_Region_Console-x86_64.AppImage); rename to
          # the canonical NeonLGControl.AppImage.
          APPIMG=$(ls -t *.AppImage | head -1)
          test -n "$APPIMG"
          mv "$APPIMG" NeonLGControl.AppImage
          chmod +x NeonLGControl.AppImage
          ls -lh NeonLGControl.AppImage

      - name: Upload packaging log (diagnostics)
        if: failure()
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git checkout -B ci-appimage-log
          git add package_log.txt verify_log.txt 2>/dev/null || true
          git commit -m "AppImage packaging log ($(date -u +%Y%m%dT%H%M%SZ))" || true
          git push --force origin ci-appimage-log:ci-appimage-log

      - name: Verify AppImage structure
        run: |
          rm -rf /tmp/appimg_check && mkdir -p /tmp/appimg_check
          cd /tmp/appimg_check
          "$GITHUB_WORKSPACE/dist/NeonLGControl.AppImage" --appimage-extract 2>&1 | tee "$GITHUB_WORKSPACE/verify_log.txt"
          ls squashfs-root/usr/bin/NeonLGControl
          test -f squashfs-root/NeonLGControl.desktop
          echo "AppImage structure OK"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonLGControl-Linux-AppImage
          path: dist/NeonLGControl.AppImage
          if-no-files-found: error
